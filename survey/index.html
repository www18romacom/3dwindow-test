<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창호 실측 입력</title>
<style>
  :root {
    --bg: #eceae6;
    --panel: #ffffff;
    --panel-2: #f6f4f1;
    --ink: #23232a;
    --ink-2: #5d5d67;
    --ink-3: #8d8d97;
    --line: #d9d5cf;
    --accent: #d8442420;
    --accent-solid: #d84424;
    --accent-ink: #ffffff;
    --mullion: #52565c;
    --mullion-soft: #52565c1f;
    --turn: #2f8577;
    --turn-soft: #2f85771f;
    --ok: #2f7d5a;
    --shadow: 0 1px 2px rgba(35,35,42,.06), 0 8px 24px rgba(35,35,42,.06);
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1e; --panel: #232329; --panel-2: #2b2b32;
      --ink: #eceaea; --ink-2: #a8a8b2; --ink-3: #7c7c86; --line: #3a3a43;
      --accent: #ff6a4520; --accent-solid: #ff6a45; --accent-ink: #1a1a1e;
      --mullion: #9a9fa8; --mullion-soft: #9a9fa826;
      --turn: #5fb8a8; --turn-soft: #5fb8a826; --ok: #62c398;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a1e; --panel: #232329; --panel-2: #2b2b32;
    --ink: #eceaea; --ink-2: #a8a8b2; --ink-3: #7c7c86; --line: #3a3a43;
    --accent: #ff6a4520; --accent-solid: #ff6a45; --accent-ink: #1a1a1e;
    --mullion: #9a9fa8; --mullion-soft: #9a9fa826;
    --turn: #5fb8a8; --turn-soft: #5fb8a826; --ok: #62c398;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    min-height: 100vh;
  }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 18px 22px 0; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--ink-3); font-size: 13px; }

  .wrap {
    display: grid; gap: 16px; padding: 16px 22px 40px;
    grid-template-columns: minmax(0, 1fr) minmax(430px, 480px);
    align-items: start;
  }
  @media (max-width: 1000px) { .wrap { grid-template-columns: minmax(0,1fr); } }
  @media (max-width: 600px) {
    header { padding: 12px 8px 0; }
    .wrap { gap: 10px; padding: 10px 6px 28px; }
    .floorplan-card .body { padding: 4px; }
    .floorplan-card > h2 { padding-inline: 10px; }
    .floorplan-card .btnrow { padding-inline: 4px; }
    #drop { min-height: 220px; }
    .marker { width: 20px; height: 20px; margin: -10px 0 0 -10px;
      border-width: 1.5px; font-size: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .marker.sel { transform: scale(1.15); box-shadow: 0 0 0 2px var(--accent); }
    .marker.entry-marker { background: #287a68; border-color: #287a68; color: #fff;
      font-size: 7px; letter-spacing: -.08em; }
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
  }
  .card > h2 {
    margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 700;
    letter-spacing: .04em; color: var(--ink-2); text-transform: uppercase;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
    display: flex; align-items: center; gap: 10px;
  }
  .card > h2 .hint { font-weight: 400; text-transform: none; letter-spacing: 0;
                     color: var(--ink-3); font-size: 12px; margin-left: auto; }
  #scalehint { color: var(--ink-3); font-size: 12.5px; align-self: center; }
  .body { padding: 16px; }

  label.field { display: block; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-2); }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  }
  select { cursor: pointer; }
  input:focus-visible, select:focus-visible, button:focus-visible, .marker:focus-visible {
    outline: 2px solid var(--accent-solid); outline-offset: 2px;
  }
  input.dim { text-align: right; font-variant-numeric: tabular-nums; }
  textarea { min-height: 76px; resize: vertical; }

  button {
    font: inherit; padding: 8px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  }
  button:hover { border-color: var(--ink-3); }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  button.primary { background: var(--accent-solid); border-color: var(--accent-solid);
                   color: var(--accent-ink); font-weight: 700; }
  button.primary:hover { filter: brightness(1.06); }
  button.tiny { padding: 5px 10px; font-size: 13px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .plan-tools { margin-top: 12px; }
  .plan-tools .tool-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .plan-tools .tool-group:first-child { margin-top: 0; }
  .plan-tools .danger-tool { color: #b52d26; border-color: #d8aaa5; background: #fff7f6; }
  .plan-tools .danger-tool:hover { border-color: #b52d26; }
  .compact-label { display: none; }
  @media (max-width: 600px) {
    .plan-tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px; margin-top: 7px; }
    .plan-tools .tool-group { display: contents; }
    .plan-tools button { min-width: 0; min-height: 34px; padding: 5px 2px;
      border-radius: 6px; font-size: 11.5px; line-height: 1.15; white-space: nowrap; }
    .plan-tools #calibrate { grid-column: span 2; }
    .plan-tools #scalehint { grid-column: 1 / -1; min-width: 0; margin: -1px 2px 0 !important;
      font-size: 10.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    .full-label { display: none; }
    .plan-tools .compact-label { display: inline; }
  }

  /* ---- 평면도 ---- */
  #drop {
    position: relative; border: 2px dashed var(--line); border-radius: 10px;
    background: var(--panel-2); min-height: 300px; display: grid; place-items: center;
    text-align: center; color: var(--ink-3); padding: 30px 20px;
  }
  #drop.hasimg { border-style: solid; padding: 0; background: none; display: block; }
  #drop.drag { border-color: var(--accent-solid); background: var(--accent); }
  #stage { position: relative; line-height: 0; overflow: hidden; border-radius: 8px; }
  #plan { width: 100%; display: block; }

  .marker {
    position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; display: grid; place-items: center;
    font: 700 14px/1 system-ui, sans-serif; cursor: grab;
    border: 2px solid var(--accent-solid); background: var(--panel); color: var(--accent-solid);
    box-shadow: 0 2px 6px rgba(0,0,0,.28); touch-action: none; user-select: none; padding: 0;
    z-index: 4;
  }
  .marker.done { background: var(--accent-solid); color: var(--accent-ink); }
  .marker.sel { transform: scale(1.25); z-index: 5; box-shadow: 0 0 0 4px var(--accent); }
  .marker.entry-marker { background: #287a68; border-color: #287a68; color: #fff;
    font-size: 10px; letter-spacing: -.08em; }
  .survey-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .survey-actions button { min-width: 0; }
  .survey-actions #generate3d { grid-column: auto; color: var(--ink-3); background: transparent; }
  .site-setup { margin-bottom: 16px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
  .site-setup-head { display:flex; align-items:center; gap:8px; }
  .site-setup-head b { flex:1; }
  .site-setup textarea { margin-top:10px; min-height:86px; background:var(--panel); }
  .site-fields { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px; }
  .site-fields .wide { grid-column:1 / -1; }
  .site-preview { margin-top:10px; padding:9px 10px; border-radius:8px; background:var(--panel); color:var(--ink-2); font-size:12.5px; word-break:break-word; }
  .site-setup-actions { display:flex; gap:8px; margin-top:10px; }
  .site-setup-actions button { flex:1; }
  .site-setup.collapsed > :not(.site-setup-head) { display:none; }
  @media (max-width: 600px) {
    .site-fields { grid-template-columns:1fr; }
    .site-fields .wide { grid-column:auto; }
    .survey-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .survey-actions #generate3d { grid-column: 1 / -1; }
  }
  .wall-edit { position: absolute; height: 4px; transform-origin: 0 50%; pointer-events: none;
    z-index: 3; border-radius: 2px; opacity: .9; }
  .wall-edit.add { background: #2185d0; }
  .wall-edit.remove { height: 0; border-top: 3px dashed #e03d32; border-radius: 0; }

  /* ---- 실제 비율 폭 표시 막대(축척 설정 후) — 각진 직사각형(둥근 모서리 아님) ---- */
  .span-bar {
    position: absolute; transform: translate(-50%, -50%);
    background: var(--accent-solid); opacity: .5; border-radius: 0;
    pointer-events: none; z-index: 3; min-width: 10px; min-height: 10px;
  }
  .span-bar.sel { opacity: .8; }
  .pick-dot {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border: 3px solid #fff; border-radius: 50%; background: var(--accent-solid);
    box-shadow: 0 1px 5px rgba(0,0,0,.4); z-index: 8; pointer-events: none;
  }

  /* ---- 개소 카드 (아코디언, VS Code 트리 스타일) ---- */
  .op {
    border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 6px; background: var(--panel-2); overflow: hidden;
  }
  .op.open { border-color: var(--accent-solid); box-shadow: 0 0 0 3px var(--accent); }
  .op.dragging-row { opacity: .9; box-shadow: 0 8px 22px rgba(20,20,25,.22); position: relative; z-index: 6; }
  .op-head { padding: 8px 10px; cursor: pointer; }
  .op-head-row { display: flex; align-items: center; gap: 6px; }

  .drag-handle {
    flex: none; width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
    font-size: 17px; line-height: 1; color: var(--ink-3); cursor: grab; touch-action: none;
    background: none; border: none; border-radius: 8px;
  }
  .drag-handle:hover { background: var(--line); color: var(--ink); }
  .drag-handle:active { cursor: grabbing; }

  .chev-ico {
    flex: none; width: 22px; height: 22px; display: grid; place-items: center;
    color: var(--ink-3); font-size: 15px; transition: transform .15s;
  }
  .op.open .chev-ico { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .chev-ico { transition: none; } }

  .no {
    flex: none; display: grid; place-items: center; width: 24px; height: 24px;
    border-radius: 50%; border: 2px solid var(--accent-solid); color: var(--accent-solid);
    font: 700 12px/1 system-ui, sans-serif; background: var(--panel);
  }
  .no.done { background: var(--accent-solid); color: var(--accent-ink); }
  .no.entry-no { background: #287a68; border-color: #287a68; color: #fff;
    font-size: 8px; letter-spacing: -.08em; }

  .nm { flex: 1; min-width: 0; }

  .reorder { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .reorder button {
    width: 24px; height: 18px; padding: 0; font-size: 9px; line-height: 1;
    border-radius: 4px; display: grid; place-items: center;
  }
  .x { flex: none; border: none; background: none; color: var(--ink-3); font-size: 17px; padding: 2px 6px; }
  .x:hover { color: var(--accent-solid); }

  .op-sum {
    margin: 4px 0 0 58px; font-size: 12px; color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .op.open .op-sum { display: none; }

  .op-body { display: none; padding: 0 12px 12px; }
  .op.open .op-body { display: block; }

  .frame-row { margin-top: 10px; display: grid; gap: 10px; }
  .frame-row .lab { font-size: 11.5px; color: var(--ink-3); margin-bottom: 3px; display: block; }
  .survey-detail-grid { margin-top: 10px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .survey-detail-grid .field { margin:0; font-size:11.5px; }
  .survey-detail-grid input { min-width:0; padding:8px 9px; }
  @media(max-width:600px){.survey-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 8px; }
  .grid2 .lab { font-size: 11.5px; color: var(--ink-3); margin-bottom: 3px; display: block; }

  .parts { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .parts > .cap { font-size: 11.5px; color: var(--ink-3); margin-bottom: 8px; }

  .part {
    border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 9px;
    margin-bottom: 10px; background: var(--panel);
    box-shadow: 0 1px 2px rgba(20,20,25,.05);
  }
  .part.mullion { border-color: var(--mullion); background: var(--mullion-soft); }
  .part.turn { border-color: var(--turn); background: var(--turn-soft); }
  .part-top { display: flex; align-items: center; gap: 7px; }
  .part-top .pno { flex: none; width: 16px; color: var(--ink-3); font-size: 11.5px;
                    font-variant-numeric: tabular-nums; }
  .part-top .tag { flex: none; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .part.mullion .tag { background: var(--mullion); color: #fff; }
  .part.turn .tag { background: var(--turn); color: #fff; }
  .part.sash .tag { background: var(--accent-solid); color: var(--accent-ink); }
  .part-top .sp { margin-left: auto; }
  .part-top select.spec { max-width: 140px; }

  .part.sash .grid2, .part.turn .grid2 { grid-template-columns: 1fr 1fr; }

  .startchoice { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .startchoice button { flex: 1; min-width: 120px; padding: 12px; font-weight: 700; }
  .startchoice .cap2 { width: 100%; font-size: 12.5px; color: var(--ink-3); margin-bottom: 2px; }

  /* ---- 개소별 3D 미리보기 ---- */
  .mini3d-wrap { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .mini3d-wrap > .cap { font-size: 11.5px; color: var(--ink-3); margin-bottom: 7px; }
  .mini3d { position: relative; border: 1px solid var(--line); border-radius: 8px;
            background: var(--panel); overflow: hidden; min-height: 170px;
            display: flex; align-items: center; justify-content: center; }
  .mini3d canvas { display: block; width: 100%; height: 170px; touch-action: none; }
  .admin-result { width: min(1180px, calc(100vw - 28px)); max-height: 92vh; }
  #project3d { position: relative; min-height: 440px; border: 1px solid var(--line);
    border-radius: 10px; background: #eef1f3; overflow: hidden; }
  #project3d canvas { display: block; width: 100%; height: 440px; touch-action: none; }
  .admin-badge { display: inline-block; margin-left: 8px; padding: 3px 7px; border-radius: 999px;
    background: #3f4850; color: #fff; font-size: 11px; vertical-align: middle; }
  dialog { width: min(620px, calc(100vw - 28px)); max-height: 78vh; padding: 0;
    border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--panel); }
  dialog::backdrop { background: rgba(20,24,28,.45); }
  .dialog-head { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dialog-body { padding: 12px 16px 16px; overflow: auto; }
  .saved-row { display: grid; grid-template-columns: minmax(0,1fr) 110px auto; gap: 8px;
    align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .saved-row:last-child { border-bottom: 0; }
  .saved-date { color: var(--ink-3); font-size: 12px; }
  @media (max-width: 600px) { .saved-row { grid-template-columns: 1fr auto; }
    .saved-row .saved-date { grid-column: 1; grid-row: 2; color: var(--ink-3); font-size: 12px; }
    .saved-row button { grid-column: 2; grid-row: 1 / span 2; } }
  .mini3d-empty { color: var(--ink-3); font-size: 12.5px; padding: 18px; text-align: center; }

  .empty { color: var(--ink-3); font-size: 13.5px; padding: 18px 4px; text-align: center; }
  .status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 10px 16px; border-top: 1px solid var(--line);
            background: var(--panel-2); font-size: 13px; color: var(--ink-2); }
  .status b { color: var(--ink); }
  .status .done { color: var(--ok); font-weight: 700; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    z-index: 50; max-width: 86vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>창호 실측 입력</h1>
  <p>평면도에 번호를 찍고, 그 번호대로 치수를 입력합니다.</p>
</header>

<div class="wrap">

  <section class="card">
    <div class="body">
      <div class="site-setup" id="sitesetup">
        <div class="site-setup-head"><b>기초내용 붙여넣기</b><button type="button" class="tiny" id="editsitesetup" hidden>기초정보 확인/수정</button></div>
        <label class="field" for="basetext" style="margin-top:8px">일정 내용을 붙여넣으면 가능한 항목을 자동으로 채웁니다</label>
        <textarea id="basetext" placeholder="예: 실측(박) | 10년 보증 체크 / 구리시 교문동 덕현아파트 107동 1903호 / 010-0000-0000"></textarea>
        <button type="button" class="tiny" id="parsebase" style="margin-top:7px">붙여넣은 내용 분석</button>
        <div class="site-fields">
          <label class="field">실측 날짜<input type="date" id="setupdate"></label>
          <label class="field">담당자<input type="text" id="setupmanager" value="박" placeholder="예: 박"></label>
          <label class="field">거래처<select id="setupvendor"><option>LX</option><option>KCC</option><option>홈CC</option><option value="custom">직접입력</option></select></label>
          <label class="field" id="setupvendorcustomwrap" hidden>거래처 직접입력<input type="text" id="setupvendorcustom"></label>
          <label class="field">거래처명<input type="text" id="setupvendorname" value="와이케이" placeholder="예: 와이케이"></label>
          <label class="field wide">현장주소<input type="text" id="setupaddress" placeholder="예: 구리시 교문동 덕현아파트 107동 1903호"></label>
          <label class="field wide">현장명<input type="text" id="setupname" placeholder="복붙 내용으로 확실하지 않으면 직접 입력하세요"></label>
          <label class="field wide">비고<input type="text" id="setupnote" placeholder="예: 10년 보증 체크, 49평형"></label>
        </div>
        <div class="site-preview" id="sitepreview" aria-live="polite"></div>
        <div class="site-setup-actions"><button type="button" class="primary" id="applysite">현장명 적용</button></div>
      </div>
    </div>
  </section>

  <section class="card floorplan-card">
    <h2>평면도 <span class="hint" id="planhint">이미지를 올린 뒤 클릭하면 번호가 찍힙니다</span></h2>
    <div class="body">
      <div id="drop">
        <div id="ph">
          <p style="margin:0 0 10px"><b>평면도 이미지를 끌어다 놓거나</b></p>
          <button type="button" id="pick">파일 선택</button>
          <p style="margin:10px 0 0; font-size:12.5px">PNG · JPG</p>
        </div>
        <div id="stage" hidden><img id="plan" alt="평면도"></div>
      </div>
      <input type="file" id="file" accept="image/*" class="sr">
      <div class="plan-tools" role="toolbar" aria-label="평면도 편집 도구">
        <div class="tool-group">

  }
  function analyzePlacement(x, y) {
    if (!planPixels) return { x: x, y: y, angle: edgeFallbackAngle(x, y), mode: "free", wallLock: null };
    var cx = x * planPixels.w, cy = y * planPixels.h;
    var vertical = nearestWallLine(cx, cy, true), horizontal = nearestWallLine(cx, cy, false);
    if (vertical || horizontal) {
      var useVertical = vertical && (!horizontal || vertical.score >= horizontal.score);
      if (useVertical) {
        var sx = Math.min(1, Math.max(0, vertical.coordinate / planPixels.w));
        return { x: sx, y: y, angle: 90, mode: "wall", wallLock: { angle: 90, coordinate: sx } };
      }
      var sy = Math.min(1, Math.max(0, horizontal.coordinate / planPixels.h));

    if (Math.max(hs, vs) >= .30 && Math.abs(hs - vs) >= .08) return vs > hs ? 90 : 0;

    // 터닝도어처럼 개구부의 허공을 찍으면 서로 마주 보는 가장 가까운 두 벽을 찾는다.

  /* ---------------- 저장 / 복원 ---------------- */
  function persist() {

    var raw;

    try {
      var s = JSON.parse(raw);
      if (s && Array.isArray(s.pins)) {
        state = { site: s.site || "", siteSetup: s.siteSetup || {}, planName: s.planName || "",
                  surveyDate: s.surveyDate || todayLocal(),
                  planData: s.planData || "", pins: s.pins,
                  scale: s.scale && (s.scale.mmPerPixel || s.scale.mmPerFracX) ? s.scale : null,
                  flipV: !!s.flipV, flipH: !!s.flipH,
                  wallEdits: s.wallEdits || { add: [], remove: [] } };
        if (!Array.isArray(state.wallEdits.add)) state.wallEdits.add = [];
        if (!Array.isArray(state.wallEdits.remove)) state.wallEdits.remove = [];
        state.pins.forEach(function (p) {
          if (!Array.isArray(p.parts)) p.parts = [];
          p.parts.forEach(function (t) {
            if (t.kind === "mullion") t.spec = t.spec === "100×45" ? "40×105" : normalizeMullionSpec(t.spec);
            if (t.kind === "turn") { t.swing = "push"; t.handle = "right"; }
            if (t.kind === "entry") { t.w = "900"; t.h = "2100"; if (typeof t.drawInDrawing !== "boolean") t.drawInDrawing = false; }
            if (t.kind === "sash" && !t.sashType) t.sashType = t.panels === "고정" ? "fix" : "normal";
          });

            return t.kind === "turn" ? newEntry() : t;
          });
          if (typeof p.frame !== "string") p.frame = "";
          if (typeof p.notes !== "string") p.notes = "";
          if (typeof p.composition !== "string") p.composition = "";
          if(isEntryPin(p)&&typeof p.drawInDrawing!=="boolean")p.drawInDrawing=!!(p.parts.filter(function(t){return t.kind==="entry";})[0]||{}).drawInDrawing;
          p.details = normalizedDetails(p.details);
          if (typeof p.angle !== "number") p.angle = 0;
          if (p.placementMode !== "wall") p.placementMode = "free";
          if (!p.wallLock || typeof p.wallLock.coordinate !== "number") p.wallLock = null;

  var rdIdx = -1, rdStartY = 0, rdRowH = 44, rdEl = null;
  function onHandleDown(e) {
    e.stopPropagation();
    rdIdx = +this.dataset.i;
    if (activeMini3D) { activeMini3D.cancel(); activeMini3D = null; }
    document.querySelectorAll(".op.open").forEach(function (el) { el.classList.remove("open"); });
    sel = null;
    var rows = document.querySelectorAll(".op");
    rdEl = rows[rdIdx];
    rdRowH = rdEl.getBoundingClientRect().height + 6;

  }
  function onHandleUp(e) {
    if (rdIdx < 0) return;
    var dy = e.clientY - rdStartY;
    var shift = Math.round(dy / rdRowH);
    var target = Math.min(state.pins.length - 1, Math.max(0, rdIdx + shift));
    if (rdEl) { rdEl.style.transform = ""; rdEl.classList.remove("dragging-row"); }
    if (target !== rdIdx) {

  /* ---------------- 판정 / 요약 ---------------- */
  // 폭·높이 치수가 필요한 구성(창/터닝도어/현관문). 통바는 폭 규격만 있고 실측 완료 판정에서 제외.
  function sizedParts(p) {
    return p.parts.filter(function (t) { return t.kind === "sash" || t.kind === "turn" || t.kind === "entry"; });
  }
  // "0"은 기본입력값일 뿐 실제 실측 아님 — 0보다 커야 완료로 판정한다.
  function hasSize(t) { return Number(t.w) > 0 && Number(t.h) > 0; }
  function isDone(p) {
    var s = sizedParts(p);
    return s.length > 0 && s.every(hasSize);
  }
  function summarize(p) {
    if (!p.parts.length) return "구성 선택 전";
    var s = sizedParts(p);
    var base = (s.length && hasSize(s[0])) ? (s[0].w + "×" + s[0].h) : "치수 미입력";
    var extra = p.parts.length > 1 ? (" 외 " + (p.parts.length - 1) + "개 구성") : "";
    var frame = p.frame ? (" · " + p.frame) : "";
    return base + extra + frame;
  }

          no: i + 1,
          name: p.name || "",
          frame: p.frame || null,
          notes: p.notes || "",
          composition: p.composition || "",
          drawInDrawing: isEntryPin(p) ? !!p.drawInDrawing : undefined,
          details: normalizedDetails(p.details),
          parts: p.parts.map(function (t) {
            if (t.kind === "mullion") return { kind: "mullion", spec: t.spec };
            if (t.kind === "entry") return { kind: "entry", width: 900, height: 2100, drawInDrawing: !!t.drawInDrawing };
            if (t.kind === "turn") return { kind: "turn", width: num(t.w), height: num(t.h),
                                             swing: t.swing, handle: t.handle, openDegrees: 15 };
            return { kind: "sash", sashType: t.sashType || "normal", width: num(t.w), height: num(t.h),
                     panels: panelsOut(t.panels), primary: t.primary };
          }),
          plan: { x: Math.round(p.x * 10000) / 10000, y: Math.round(p.y * 10000) / 10000,
                  angle: p.angle || 0, placementMode: p.placementMode || "free" }
        };
      })
    };
  }

  $("savedrawing").addEventListener("click", async function () {
    var button=this; button.disabled=true;
    try { await saveDrawingPNG(); toast("실측도면 PNG를 저장했습니다"); }
    catch(e) { toast(e.message || "도면을 저장하지 못했습니다"); }
    finally { button.disabled=false; }
  });
  $("printdrawing").addEventListener("click", function () {
    var w = window.open("", "_blank");
    if (!w) { toast("인쇄 창이 차단되었습니다"); return; }
    w.document.open(); w.document.write(buildDrawingHTML(true)); w.document.close();
  });

  // 로컬 개발 화면은 관리자 테스트로 열고, 웹 배포 시에는 홈페이지 로그인 코드가
  // window.YK_CURRENT_USER_ROLE = "admin"을 주입한 경우에만 버튼을 표시한다.
  var IS_ADMIN = location.protocol === "file:" || window.YK_CURRENT_USER_ROLE === "admin" ||
    new URLSearchParams(location.search).get("testAdmin") === "1";
  $("generate3d").hidden = !IS_ADMIN;
  function showDialogSafe(dialog) {
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", "");
  }
  function waitFor3DEngine(timeoutMs) {
    if (window.__THREE && window.__OrbitControls) return Promise.resolve(true);
    return new Promise(function (resolve) {
      var finished = false;
      function done(ok) {
        if (finished) return; finished = true;
        window.removeEventListener("mini3d-ready", ready);
        clearTimeout(timer); resolve(ok);
      }
      function ready() { done(!!(window.__THREE && window.__OrbitControls)); }
      var timer = setTimeout(function () { done(false); }, timeoutMs);
      window.addEventListener("mini3d-ready", ready);
    });
  }
  $("generate3d").addEventListener("click", async function () {
    if (!IS_ADMIN) { toast("관리자만 3D를 생성할 수 있습니다"); return; }
    if (!state.pins.length || !state.pins.some(isDone)) { toast("실측값을 먼저 입력해주세요"); return; }
    if (activeProject3D) activeProject3D.cancel();
    if (!$("adminresult").open) showDialogSafe($("adminresult"));
    $("project3d").innerHTML = '<div class="mini3d-empty">3D 엔진을 불러오는 중입니다…</div>';
    var button = this, oldText = button.textContent;
    button.disabled = true; button.textContent = "3D 준비 중…";
    try {
      var ready = await waitFor3DEngine(15000);
      if (!ready) throw new Error("3D 엔진을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.");
      activeProject3D = mountProject3D($("project3d"));
      toast("3D를 생성했습니다");
    } catch (err) {
      $("project3d").innerHTML = '<div class="mini3d-empty">' + String(err.message || err) + '</div>';
      toast("3D 생성에 실패했습니다");
    } finally {
      button.disabled = false; button.textContent = oldText;
    }
  });
  $("close3d").addEventListener("click", function () {
    if (activeProject3D) { activeProject3D.cancel(); activeProject3D = null; }
    $("adminresult").close();
  });

  function openSurveyDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open("yk-window-surveys", 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains("surveys")) db.createObjectStore("surveys", { keyPath: "id" });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function surveyId() { return (state.surveyDate || todayLocal()) + "|" + (state.site || "").trim(); }
  $("save").addEventListener("click", async function () {
    state.site = $("site").value.trim(); state.surveyDate = $("surveydate").value || todayLocal();
    if (!state.site) { toast("현장명을 입력해주세요"); $("site").focus(); return; }
    try {
      var db = await openSurveyDB();
      var tx = db.transaction("surveys", "readwrite");
      tx.objectStore("surveys").put({ id: surveyId(), site: state.site, surveyDate: state.surveyDate,
        updatedAt: new Date().toISOString(), payload: JSON.stringify(state) });
      await new Promise(function (resolve, reject) { tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); }; });
      db.close(); persist(); toast(state.surveyDate + " · " + state.site + " 실측파일을 저장했습니다");
    } catch (e) { toast("저장하지 못했습니다: " + e.message); }
  });

  function applySavedState(saved) {
    state = saved;
    state.site = state.site || ""; state.surveyDate = state.surveyDate || todayLocal();
    state.siteSetup = normalizedSetup(state.siteSetup || (state.project && state.project.siteSetup));
    state.pins = Array.isArray(state.pins) ? state.pins : [];
    state.wallEdits = state.wallEdits || { add: [], remove: [] };
    if (!Array.isArray(state.wallEdits.add)) state.wallEdits.add = [];
    if (!Array.isArray(state.wallEdits.remove)) state.wallEdits.remove = [];
    state.pins.forEach(function (p) {
      if (typeof p.frame !== "string") p.frame = "";
      if (typeof p.notes !== "string") p.notes = "";
      if (typeof p.composition !== "string") p.composition = "";
      p.details = normalizedDetails(p.details);
      if (!Array.isArray(p.parts)) p.parts = [];
      if (Array.isArray(p.parts)) p.parts.forEach(function (t) {
        if (t.kind === "mullion") t.spec=t.spec === "100×45"?"40×105":normalizeMullionSpec(t.spec);
        if (t.kind === "turn") { t.swing = "push"; t.handle = "right"; }
        if (t.kind === "entry") { t.w = "900"; t.h = "2100"; if(typeof t.drawInDrawing!=="boolean")t.drawInDrawing=false; }
        if (t.kind === "sash" && !t.sashType) t.sashType=t.panels==="고정"?"fix":"normal";
      });
      if (/현관/.test(p.name || "") && Array.isArray(p.parts)) p.parts = p.parts.map(function (t) {
        return t.kind === "turn" ? newEntry() : t;
      });
      if(isEntryPin(p)&&typeof p.drawInDrawing!=="boolean")p.drawInDrawing=!!(p.parts.filter(function(t){return t.kind==="entry";})[0]||{}).drawInDrawing;
    });
    $("site").value = state.site; $("surveydate").value = state.surveyDate;
    fillSetup(!!state.site);
    sel = null; updateScaleHint();
    if (state.planData) showPlan(state.planData, state.planName); else render();
    persist();
  }
  async function showSavedSurveys() {
    var host = $("savedlist"); host.innerHTML = '<div class="empty">불러오는 중…</div>';
    $("savedialog").showModal();
    try {
      var db = await openSurveyDB(), tx = db.transaction("surveys", "readonly");
      var req = tx.objectStore("surveys").getAll();
      var rows = await new Promise(function (resolve, reject) { req.onsuccess = function () { resolve(req.result); }; req.onerror = function () { reject(req.error); }; });
      db.close(); rows.sort(function (a, b) { return b.id.localeCompare(a.id); }); host.innerHTML = "";
      if (!rows.length) { host.innerHTML = '<div class="empty">이 브라우저에 저장된 실측현장이 없습니다.</div>'; return; }
      rows.forEach(function (row) {
        var div = document.createElement("div"); div.className = "saved-row";
        var date = document.createElement("span"); date.className = "saved-date"; date.textContent = row.surveyDate;
        var site = document.createElement("b"); site.textContent = row.site;
        var open = document.createElement("button"); open.type = "button"; open.textContent = "열기";
        open.addEventListener("click", function () {
          try { applySavedState(JSON.parse(row.payload)); $("savedialog").close(); toast(row.site + " 실측파일을 열었습니다"); }
          catch (e) { toast("저장된 내용을 읽지 못했습니다"); }
        });
        div.appendChild(site); div.appendChild(date); div.appendChild(open); host.appendChild(div);
      });
    } catch (e) { host.innerHTML = '<div class="empty">저장 목록을 불러오지 못했습니다.</div>'; }
  }
  $("load").addEventListener("click", showSavedSurveys);
  $("closesaved").addEventListener("click", function () { $("savedialog").close(); });
  $("openlegacy").addEventListener("click", function () { $("loadfile").click(); });
  $("loadfile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        var list = j && (j.openings || j.markers);
        if (!Array.isArray(list)) throw new Error("형식이 다릅니다");
        state.site = (j.project && j.project.name) || "";
        state.surveyDate = (j.project && j.project.surveyDate) || todayLocal();
        state.siteSetup = normalizedSetup(j.project && j.project.siteSetup);
        state.planName = (j.floorplan && j.floorplan.file) || "";
        state.scale = (j.floorplan && j.floorplan.scale &&
                      (j.floorplan.scale.mmPerPixel || j.floorplan.scale.mmPerFracX))
          ? j.floorplan.scale : null;
        state.wallEdits = (j.floorplan && j.floorplan.wallEdits) || { add: [], remove: [] };
        if (!Array.isArray(state.wallEdits.add)) state.wallEdits.add = [];
        if (!Array.isArray(state.wallEdits.remove)) state.wallEdits.remove = [];
        state.pins = list.map(function (m) {
          var parts;
          if (Array.isArray(m.parts) && m.parts.length) {
            parts = m.parts.map(function (t) {
              if (t.kind === "mullion") return { kind: "mullion", spec: t.spec === "100×45" ? "40×105" : normalizeMullionSpec(t.spec) };
              if (t.kind === "entry") { var entry=newEntry(); entry.drawInDrawing=!!t.drawInDrawing; return entry; }
              if (t.kind === "turn") return { kind: "turn",
                       w: t.width === null || t.width === undefined ? "" : String(t.width),
                       h: t.height === null || t.height === undefined ? "" : String(t.height),
                       swing: "push", handle: "right" };
              return { kind: "sash", sashType: t.sashType || (t.panels === "fix" ? "fix" : "normal"),
                       w: t.width === null || t.width === undefined ? "" : String(t.width),
                       h: t.height === null || t.height === undefined ? "" : String(t.height),
                       panels: t.panels === "fix" ? "고정" : (t.panels ? t.panels + "짝" : "2짝"),
                       primary: t.primary || "right" };
            });
          } else if (m.width !== undefined || m.height !== undefined) {
            parts = [{ kind: "sash",
                       w: m.width === null || m.width === undefined ? "" : String(m.width),
                       h: m.height === null || m.height === undefined ? "" : String(m.height),
                       panels: "2짝", primary: "right" }];
          } else {
            parts = [];
          }
          if (/현관/.test(m.name || "")) parts = parts.map(function (t) {
            return t.kind === "turn" ? newEntry() : t;
          });
          var importedEntry=parts.filter(function(t){return t.kind==="entry";})[0];
          return { name: m.name || "", frame: m.frame || "", notes: m.notes || "", composition: m.composition || "", drawInDrawing: typeof m.drawInDrawing==="boolean"?m.drawInDrawing:!!(importedEntry&&importedEntry.drawInDrawing), details: normalizedDetails(m.details), parts: parts,
                   x: (m.plan && m.plan.x) || 0.5, y: (m.plan && m.plan.y) || 0.5,
                   angle: (m.plan && m.plan.angle) || 0,
                   placementMode: (m.plan && m.plan.placementMode) || "free", wallLock: null };
        });
        $("site").value = state.site;
        $("surveydate").value = state.surveyDate;
        fillSetup(!!state.site);
        sel = null;
        updateScaleHint();
        render();
        toast(state.planName
          ? "불러왔습니다 — 평면도(" + state.planName + ")는 다시 올려주세요"
          : "불러왔습니다");
      } catch (err) {
        toast("읽을 수 없는 파일입니다: " + err.message);
      }
    };
    r.readAsText(f);
  });

  /* ---------------- 시작 ---------------- */
  restore();
  state.siteSetup = normalizedSetup(state.siteSetup);
  $("site").value = state.site;
  $("surveydate").value = state.surveyDate || todayLocal();
  fillSetup(!!state.site);
  updateScaleHint();
  if (state.planData) showPlan(state.planData, state.planName);
  render();
})();
</script>
</body>
</html>
